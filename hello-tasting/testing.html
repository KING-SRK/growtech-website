<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Section</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="testing.css">
</head>
<body>

    <!-- Theme Toggle -->
    <div class="theme-toggle interactive-element" id="themeToggle">
        <i class="fas fa-moon" id="themeIcon"></i>
        <span id="themeText">Dark Mode</span>
    </div>

    <!-- Animated Background -->
    <div class="bg-animation">
        <div class="floating-shapes">
            <div class="shape"></div>
            <div class="shape"></div>
            <div class="shape"></div>
        </div>
    </div>

    <main>
        <!-- Hero Section -->
        <section class="hero">
            <div class="particles" id="particles"></div>
            <div class="hero-content">
                <h1 class="glow-title">We Turn Ideas Into Impact</h1>
                <p class="hero-description">
                    We don't just build software — we craft digital masterpieces. At Grow Tech,
                    we transform your visionary ideas into powerful, scalable solutions that inspire,
                    connect, and evolve with your ambitions.
                </p>
                <a href="#services" class="hero-btn interactive-element">
                    <i class="fas fa-rocket" style="margin-right: 8px;"></i>
                    Explore Our Universe
                </a>
            </div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
